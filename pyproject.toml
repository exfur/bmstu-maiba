[project]
name = "maiba-bi"
version = "0.1.0"
description = "Шаблон курсового проекта по ИИ в бизнес-аналитике"
requires-python = ">=3.11,<3.13" 
dependencies = [
    # Анализ данных и EDA
    "pandas>=2.1.0,<3.0.0",        # Предобработка, очистка и манипуляции с табличными данными
    "numpy>=1.26.0,<2.0.0",         # Математические функции и матрицы (совместимо с PyCaret/SHAP)

    # Визуализация данных
    "matplotlib>=3.8.0",           # Базовое построение графиков и диаграмм
    "seaborn>=0.13.0",             # Статистическая визуализация данных
    "plotly>=5.18.0",              # Интерактивные графики для бизнес-отчетов

    # Запуск нейросетей & NLP
    "transformers>=4.38.0,<5.0.0", # Загрузка и запуск предобученных моделей Hugging Face
    "torch>=2.2.0",                # Фреймворк PyTorch в качестве CPU бэкенда
    "sentencepiece>=0.2.0",         # Токенизатор для мультиязычных моделей (XLM-RoBERTa)
    "protobuf>=4.25.0",             # Зависимость для корректной работы токенизатора
    "tokenizers<0.23",
    "textblob>=0.17.1",            # Легковесная обработка текста

    # Машинное обучение и Прогнозирование
    "scikit-learn>=1.4.0,<1.6.0",  # Алгоритмы классификации, регрессии и кластеризации
    "lightgbm>=4.3.0",             # Градиентный бустинг для AutoML
    "prophet>=1.1.5",              # Прогнозирование временных рядов от Meta
    "statsmodels>=0.14.0",         # Статистическая декомпозиция временных рядов
    "pmdarima>=2.0.0",             # Автоматический подбор параметров Auto-ARIMA

    # AutoML и Объяснимый ИИ (XAI)
    "pycaret>=3.3.0",              # Low-code AutoML фреймворк
    "shap>=0.44.0",                # SHAP-объяснения предсказаний («черного ящика»)

    # Интеграция, Deployment & Утилиты
    "fastapi>=0.110.0",            # REST API для интеграции с Power BI
    "pydantic>=2.6.0",             # Валидация типов входящих REST-запросов
    "uvicorn>=0.28.0",             # ASGI-сервер для запуска FastAPI
    "joblib>=1.3.0",               # Сериализация и сохранение моделей (.pkl)
    "ipykernel>=6.29.0",           # Ядро Jupyter для запусков в виртуальном окружении
    "ipywidgets>=8.0.0",           # Статус-бары tqdm и интерактивные виджеты
]

[tool.uv]
package = false
# Explicitly instruct uv to allow the pre-release for pycaret
prerelease = "allow"
